name: docker-pull

on:
  push:
    branches: main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout the code
        uses: actions/checkout@v4

      # - name: Setup NodeJS
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20

      # - name: Install dependencies
      #   run: npm install

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/docker-image:latest .

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/docker-image:latest

      - name: Login into Ec2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets. EC2_HOST}}
          username: ${{ secrets.EC2_USERNAME}}
          key: ${{secrets.Ec2_ssh_key}}
          script:
            - sudo docker pull ${{ secrets.DOCKER_USERNAME}}/docker-image:latest
            - sudo docker stop docker-container || true
            - sudo docker rm docker-container || true

            -  sudo dcoker run -d \
                --name docker-container \
                -p 3000:3000 \
                ${{ secrets.DOCKER_USERNAME}}docker-images:latest